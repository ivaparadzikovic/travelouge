name: Keep Supabase alive

on:
  schedule:
    - cron: '0 6 */3 * *' 
  workflow_dispatch: {} 

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          set -euo pipefail
          URL="https://ihynhvuwmshvqtoyclti.supabase.co/rest/v1/posts?select=id&limit=1"
          KEY="sb_publishable_cau7GWa7d52Hoh2CpaNAEw_RfpO_G-u"
          code=$(curl -s -o /dev/null -w '%{http_code}' "$URL" \
            -H "apikey: $KEY" \
            -H "Authorization: Bearer $KEY")
          echo "Supabase responded with HTTP $code"
          if [ "$code" != "200" ]; then
            echo "::error::Unexpected status $code — the project may be paused or the key changed."
            exit 1
          fi
